services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umami}
      POSTGRES_USER: ${POSTGRES_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-changeme}
    volumes:
      - umami-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-umami}']
      interval: 5s
      timeout: 5s
      retries: 10

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    # Ligado SÓ a localhost: quem expõe publicamente é o Tailscale Funnel (ver README).
    # A porta 3001 evita conflito com a API de download-gate (api/, que usa a 3000).
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-umami}:${UMAMI_DB_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-umami}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${UMAMI_APP_SECRET:-dev-secret-change-me}
    depends_on:
      db:
        condition: service_healthy

volumes:
  umami-db:
