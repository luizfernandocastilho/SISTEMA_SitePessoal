name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint (Prettier)
        run: npm run lint
      - name: Type & content check
        run: npm run check
      - name: Unit tests
        run: npm test

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build sem base (para auditoria local do dist)
        env:
          BASE_PATH: /
          SITE_URL: http://localhost
        run: npm run build
      - name: Lighthouse CI (Performance & Accessibility >= 95)
        run: npx --yes @lhci/cli@0.14.x autorun
